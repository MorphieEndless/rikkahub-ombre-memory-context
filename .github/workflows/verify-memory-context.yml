name: Verify MemoryWriteContext Patch

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 上传 APK artifact 需要

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive   # 拉取 material-color-utilities 子模块

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块 preBuild 会执行 pnpm build，必须准备 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 签名/Google 服务文件是 release 才需要，debug 不需要，留空占位避免任务失败
      - name: Prepare build files (debug placeholders)
        run: |
          echo "{}" > app/google-services.json 2>/dev/null || true

      - name: Compile debug Kotlin (验证补丁可编译)
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run MemoryWriteContextTest (12 scenarios)
        run: |
          ./gradlew :app:testDebugUnitTest --tests "me.rerere.rikkahub.data.ai.mcp.MemoryWriteContextTest" --no-daemon

      - name: Assemble debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-ombre-memory-context-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
